<!DOCTYPE html>
<html>
<head>
    <title>Foodie - Online Food Ordering</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: #e63946;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .food {
            background-color: white;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
            text-align: center;
        }

        .food h2 {
            color: #e63946;
        }

        button {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b71c1c;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍔 Foodie</h1>
        <p>Delicious Food Delivered To Your Door</p>
    </header>

    <div class="container">

        <div class="food">
            <h2>Pizza</h2>
            <p>Cheesy vegetable pizza</p>
            <p>Price: ₹199</p>
            <button>Order Now</button>
        </div>

        <div class="food">
            <h2>Burger</h2>
            <p>Cheese burger with crispy fries</p>
            <p>Price: ₹149</p>
            <button>Order Now</button>
        </div>

        <div class="food">
            <h2>Biryani</h2>
            <p>Special chicken biryani</p>
            <p>Price: ₹249</p>
            <button>Order Now</button>
        </div>

        <div class="food">
            <h2>French Fries</h2>
            <p>Crispy golden french fries</p>
            <p>Price: ₹99</p>
            <button>Order Now</button>
        </div>

    </div>

    <footer>
        <p>© 2026 Foodie | Online Food Ordering</p>
    </footer>

</body>
</html>
