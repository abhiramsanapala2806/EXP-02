<!DOCTYPE html>
<html>
<head>
    <title>Age Restricted Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        form {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: #2463eb;
            color: white;
            border: none;
            padding: 10px 25px;
            cursor: pointer;
            border-radius: 5px;
        }

        #message {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Age Restricted Form</h1>

    <form onsubmit="checkAge(event)">

        <label>Enter Your Name:</label>
        <br>

        <input type="text" id="name" required>

        <br>

        <label>Enter Your Age:</label>
        <br>

        <input type="number" id="age" min="1" required>

        <br>

        <button type="submit">Submit</button>

        <p id="message"></p>

    </form>

    <script>
        function checkAge(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let age = Number(document.getElementById("age").value);
            let message = document.getElementById("message");

            if (age >= 18) {

                message.innerHTML =
                    "Welcome " + name + "! You are eligible.";

                message.style.color = "green";

            } else {

                message.innerHTML =
                    "Sorry " + name + "! You must be 18 or above.";

                message.style.color = "red";
            }
        }
    </script>

</body>
</html>
