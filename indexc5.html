
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Implementation</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">


    <!-- Internal CSS -->

    <style>

        /* Internal CSS using Class */

/* =================================
   External CSS
   ================================= */


/* Body */

body {

    margin: 0;

    padding: 0;

    font-family: Arial, sans-serif;

    background-color: #e6f2ff;
}


/* Container */

.container {

    width: 100%;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}


/* Profile Card */

.profile-card {

    width: 400px;

    padding: 30px;

    background-color: white;

    text-align: center;

    border-radius: 15px;

    box-shadow: 0px 5px 15px gray;
}


/* Paragraph */

.profile-card p {

    font-size: 16px;

    color: #333;
}


/* Skills */

.skills {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

    margin: 20px 0;
}


/* Skill Class */

.skill {

    background-color: blue;

    color: white;

    padding: 8px 15px;

    border-radius: 20px;

    font-size: 14px;
}


/* Button Class */

.button {

    background-color: green;

    color: white;

    border: none;

    padding: 12px 25px;

    border-radius: 8px;

    font-size: 16px;
}


/* Button Hover */

.button:hover {

    background-color: darkgreen;

}


    </style>

</head>


<body>

    <div class="container">

        <!-- Internal CSS -->

        <h1 class="heading">
            Student Profile
        </h1>


        <!-- Inline CSS -->

        <p class="description"
           style="font-weight: bold;">
            Welcome to my profile page
        </p>


        <div class="profile-card">

            <h2 class="student-name">
                Abhiram Sanapala
            </h2>

            <p>
                <b>Roll Number:</b> 25CS2101
            </p>

            <p>
                <b>Course:</b>
                B.Tech Computer Science Engineering
            </p>

            <p>
                <b>Year:</b> 2nd Year
            </p>

            <p>
                <b>College:</b>
                KL University
            </p>


            <h3>My Skills</h3>

            <div class="skills">

                <span class="skill">
                    HTML
                </span>

                <span class="skill">
                    CSS
                </span>

                <span class="skill">
                    JavaScript
                </span>

                <span class="skill">
                    Python
                </span>

            </div>


            <!-- Inline CSS -->

            <button class="button"
                    style="cursor: pointer;"
                    onclick="alert('Profile Viewed!')">

                View Profile

            </button>

        </div>

    </div>

</body>

</html>
