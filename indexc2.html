<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .profile {
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #2463eb;
        }

        h2 {
            color: #333;
        }

        ul {
            text-align: left;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="profile">
        <h1>My Profile</h1>

        <h2>About Me</h2>
        <p>My name is Abhiram.</p>
        <p>I am a student interested in web development and programming.</p>

        <h2>Education</h2>
        <p>B.Tech - Computer Science</p>

        <h2>Skills</h2>
        <p>HTML | CSS | JavaScript | C | Python</p>
    </div>

</body>
</html>
